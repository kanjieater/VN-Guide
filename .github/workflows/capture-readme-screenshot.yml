name: Capture README homepage screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-readme-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for current Pages assets
        shell: bash
        run: |
          for i in {1..36}; do
            if curl -fsS "https://kanjieater.github.io/VN-Guide/assets/covers/arc-the-lad-ii.png" -o /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages asset did not become available in time" >&2
          exit 1

      - name: Capture deployed homepage
        shell: bash
        run: |
          mkdir -p assets/screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found" >&2
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=5000 \
            --screenshot=assets/screenshots/homepage.png \
            "https://kanjieater.github.io/VN-Guide/"
          test -s assets/screenshots/homepage.png

      - name: Add screenshot to README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          marker = "**Live site:** [kanjieater.github.io/VN-Guide](https://kanjieater.github.io/VN-Guide/)\n"
          image = "\n![VN Guide homepage](assets/screenshots/homepage.png)\n"

          if image.strip() not in text:
              if marker not in text:
                  raise SystemExit("README live-site marker not found")
              text = text.replace(marker, marker + image, 1)
              path.write_text(text)

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/capture-readme-screenshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/screenshots/homepage.png .github/workflows/capture-readme-screenshot.yml
          git commit -m "docs: add homepage screenshot to README"
          git push
