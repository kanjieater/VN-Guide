<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#121212">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;VN Guide&quot;,&quot;short_name&quot;:&quot;VN Guide&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#121212&quot;,&quot;theme_color&quot;:&quot;#121212&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;favicon-192.png&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/png&quot;}]}">

<title>VN Guide</title>
<script src="./landing-boot.js"></script>
<style>
  :root {
    --bg: #121212;
    --text: #e0e0e0;
    --text-muted: #888;
    --accent: #4a90e2;
    --surface: #1e1e1e;
    --border: #333;
    --badge-done: #2a6b2a;
    --badge-done-text: #7ed87e;
    --badge-wip: #3a3a1a;
    --badge-wip-text: #c8b840;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100dvh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px 14px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .sort-tabs {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .sort-tabs button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    cursor: pointer;
    touch-action: manipulation;
    transition: color 0.15s, background 0.15s;
  }

  html[data-vng-sort="recent"] #btn-recent,
  html[data-vng-sort="alpha"] #btn-alpha,
  html[data-vng-filter="all"] #btn-all,
  html[data-vng-filter="playing"] #btn-playing {
    background: var(--accent);
    color: #fff;
  }

  .control-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
  }

  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
  }

  .game-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .game-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    touch-action: manipulation;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .game-card:hover,
  .game-card:focus-visible {
    border-color: var(--accent);
    background: #252535;
    outline: none;
  }

  .game-cover {
    width: 64px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--border);
  }

  .game-cover-placeholder {
    width: 64px;
    height: 90px;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--text-muted);
  }

  .game-info {
    flex: 1;
    min-width: 0;
  }

  .game-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 8px;
    word-break: break-word;
  }

  .game-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }

  .badge-guide { background: var(--badge-done); color: var(--badge-done-text); }
  .badge-wip   { background: var(--badge-wip);  color: var(--badge-wip-text);  }

  .game-arrow {
    font-size: 20px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 60px 16px;
    color: var(--text-muted);
    font-size: 15px;
  }

  .search-input {
    margin-top: 12px;
    width: 100%;
    max-width: 340px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }

  footer {
    text-align: center;
    padding: 24px 16px;
    color: var(--text-muted);
    font-size: 11px;
    border-top: 1px solid var(--border);
    max-width: 600px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<header>
  <h1>VN Guide</h1>
  <div class="control-row">
    <div class="sort-tabs">
      <button id="btn-recent" onclick="setSort('recent')">最近</button>
      <button id="btn-alpha" onclick="setSort('alpha')">あいうえお</button>
    </div>
    <div class="sort-tabs">
      <button id="btn-all" onclick="setFilter('all')">すべて</button>
      <button id="btn-playing" onclick="setFilter('playing')">プレイ中</button>
    </div>
  </div>
  <br>
  <input id="search" class="search-input" type="search" placeholder="ゲームを検索…" oninput="render()" autocomplete="off">
</header>
<main>
  <div class="game-list" id="game-list"></div>
</main>
<footer>
  <a href="https://github.com/kanjieater/VN-Guide" style="color:inherit;text-decoration:underline">GitHub</a>
  ·
  <a href="https://linktr.ee/KanjiEater" style="color:inherit;text-decoration:underline">KanjiEater</a>
</footer>
