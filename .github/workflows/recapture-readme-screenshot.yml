name: Recapture README homepage screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recapture-readme-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Capture deployed homepage
        shell: bash
        run: |
          mkdir -p assets/screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found" >&2
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1000 \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=5000 \
            --screenshot=assets/screenshots/homepage.png \
            "https://kanjieater.github.io/VN-Guide/"
          test -s assets/screenshots/homepage.png

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/recapture-readme-screenshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/homepage.png .github/workflows/recapture-readme-screenshot.yml
          git commit -m "docs: recapture homepage screenshot with Japanese fonts"
          git push
