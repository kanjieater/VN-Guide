name: Sync generated site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-site-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.INDEX_SYNC_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --no-save --ignore-scripts
      - name: Generate and commit generated site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B site-sync origin/main
            bun run generate
            git add -A -- index.html ':(glob)*/index.html' ':(glob)*/manifest.json'
            if git diff --cached --quiet; then
              echo "Generated site already current; no commit necessary"
              exit 0
            fi
            git commit -m "chore: sync generated site files"
            if git push origin HEAD:main; then
              echo "Published updated site files"
              exit 0
            fi
            echo "Concurrent main update; retrying generation ($attempt/3)"
          done
          echo "Could not publish generated site files after three attempts" >&2
          exit 1
